# "Integrations" here is meant as either:
# - downstream software that expose Hibernate projects to their users.
# - external software that can be used through Hibernate projects.
#
# 'series.yml' files of each project reference the versions of integrators the corresponding series is included in.
#
# Active series are documented for downstream projects that any member of the Hibernate team is involved in,
# because then this member provides at least "limited support" for the corresponding Hibernate project series,
# even if this series is not the latest stable.
#
# You can control which integration series are displayed using one of two approaches:
# - active_series: List the series to show; all others are hidden
# - inactive_series: List the series to hide; all others are shown according to default rules
#
# Note: active_series and inactive_series are mutually exclusive approaches.
# If you specify inactive_series, active_series is ignored.
#
# IMPORTANT: The order of entries in this file is the order they are displayed in compatibility matrices on the website.
java:
  name: Java
  url: https://www.oracle.com/java/technologies/downloads/
  inactive_series:
    # Only EOL'd Java versions mentioned in still-supported project series need to be here.
    # They are generally the more recent non-LTS versions (except *the* most recent one, of course).
    # Do NOT add LTS versions (17, 21, 25, ...): they have years of support.
    # For EOL dates, see https://endoflife.date/oracle-jdk
    - "20" # non-LTS, EOL Sep 2023
    - "22" # non-LTS, EOL Sep 2024
    - "23" # non-LTS, EOL Mar 2025
    - "24" # non-LTS, EOL Sep 2025
java_ee_jpa:
  name: JPA
  url: https://www.oracle.com/technetwork/java/javaee/tech/persistence-jsp-140049.html
jakarta_ee_jpa:
  name: Jakarta Persistence
  url: https://jakarta.ee/specifications/persistence/
jakarta_ee_data:
  name: Jakarta Data
  url: https://jakarta.ee/specifications/data/
java_ee_bv:
  name: Bean Validation
  url: https://beanvalidation.org/
jakarta_ee_bv:
  name: Jakarta Validation
  url: https://beanvalidation.org/
java_ee:
  name: Java EE
  url: https://www.oracle.com/java/technologies/java-ee-glance.html
jakarta_ee:
  name: Jakarta EE
  url: https://jakarta.ee
vertx:
  name: Vert.x
  url: https://vertx.io
dialect_mongodb:
  name: MongoDB Extension
  url: https://github.com/mongodb/mongo-hibernate/
lucene:
  name: Apache Lucene
  url: https://lucene.apache.org/core/
elasticsearch:
  name: Elasticsearch server
  url: https://www.elastic.co/products/elasticsearch
opensearch:
  name: OpenSearch server
  url: https://www.opensearch.org
quarkus:
  name: Quarkus
  url: https://quarkus.io/
  downstream: true
  hibernate_involvement: true
  active_series:
    # For release dates, see https://github.com/quarkusio/quarkus/wiki/Release-Planning
    # For included versions, see https://github.com/quarkusio/quarkus/blob/main/pom.xml
    # For LTS status, see Phase 1/2 in https://access.redhat.com/support/policy/updates/red_hat_build_of_quarkus_notes;
    # bottom line: an LTS "usually" stays active for 6 months after the next LTS was released.
    - "3.27" # LTS, stays supported until Mar 25th 2026 + 6 months = Sep 25th 2026
    - "3.33" # LTS, released Mar 25th 2026, stays supported until 3.40 + 6 months = March 30th 2027?
    - "3.38" # Non-LTS, stays supported until the next one gets released
wildfly:
  name: WildFly
  url: https://www.wildfly.org/
  downstream: true
  hibernate_involvement: true
  active_series:
    # For release dates, see https://www.wildfly.org/events/
    # For included versions, see https://github.com/wildfly/wildfly/blob/main/pom.xml
    # For included versions in preview (EE 11), see https://github.com/wildfly/wildfly/blob/main/boms/preview-ee/pom.xml
    - "41" # Released Jul 16th 2026
rheap:
  name: Red Hat EAP
  url: https://www.redhat.com/en/technologies/jboss-middleware/application-platform
  downstream: true
  hibernate_involvement: true
  active_series:
    # For lifecycle dates, see https://endoflife.date/red-hat-jboss-eap
    - "8.1" # Full Support until Feb 2028
  els_series:
    - "6.4" # ELS-2 (guidance only, no fixes) until Dec 2028
    - "7.4" # ELS-1 until Oct 2027
spring_boot:
  name: Spring Boot
  url: https://spring.io/projects/spring-boot
  downstream: true
  inactive_series:
    # Maintained on a best-effort basis.
    # For lifecycle dates, see https://endoflife.date/spring-boot
    - "1.5"
    - "2.0"
    - "2.2"
    - "2.3"
    - "2.4"
    - "2.5"
    - "2.6"
    - "3.0"
    - "3.1"
    - "3.2"
    - "3.3"
