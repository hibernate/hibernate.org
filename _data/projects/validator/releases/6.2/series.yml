summary: Keep javax.* packages, Expression Language overhaul, @SafeHtml removal
# Not actually included in any downstream integration we care about, but Marko wants to continue supporting it as the last version using javax. package names.
status: limited-support
links:
  whats_new:
    html: "/validator/releases/{series.version}/#whats-new"
  migration_guide:
    html: /validator/documentation/migration-guide/#{series.version.dashes}-x
maven:
  artifacts:
    - artifact_id: hibernate-validator
      summary: Core implementation
    - artifact_id: hibernate-validator-cdi
      summary: CDI integration
    - artifact_id: hibernate-validator-annotation-processor
      summary: Annotation processor
integration_constraints:
  java:
    version:
      - 8
      - 11
      - 17
  jakarta_ee_bv:
    version: 2.0
  jakarta_ee:
    version: 8
  quarkus:
    version:
      from: '1.12'
      to: '2.16'
  spring_boot:
    version:
      from: '2.4'
      to: '2.7'
