summary: Bean Validation 2.0 support, performance improvements.
links:
  whats_new:
    html: "/validator/releases/{series.version}/#whats-new"
  migration_guide:
    html: /validator/documentation/migration-guide/#{series.version.dashes}-x
  dist:
    sourceforge:
      zip: https://sourceforge.net/projects/hibernate/files/hibernate-validator/{release.version}/hibernate-validator-{release.version}-dist.zip/download
maven:
  artifacts:
    - artifact_id: hibernate-validator
      summary: Core implementation
    - artifact_id: hibernate-validator-cdi
      summary: CDI integration
    - artifact_id: hibernate-validator-osgi
      summary: OSGi integration
    - artifact_id: hibernate-validator-annotation-processor
      summary: Annotation processor
integration_constraints:
  java:
    version:
      - '8'
      - '11'
      - '17'
  java_ee_bv:
    version: '2.0'
  java_ee:
    version: '8'
  spring_boot:
    version:
      from: '2.0'
      to: '2.2'
  wildfly:
    version:
      from: '12'
      to: '16'
  rheap:
    version: '7.4'
