summary: Jakarta EE 10, @UUID constraint
links:
  reference_doc:
    html: https://docs.hibernate.org/validator/{series.version}/reference/en-US/html_single/
    pdf: https://docs.hibernate.org/validator/{series.version}/reference/en-US/pdf/hibernate_validator_reference.pdf
  whats_new:
    html: "/validator/releases/{series.version}/#whats-new"
  introduction:
    - name: Getting Started
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/validator/{series.version}/reference/en-US/html_single/#validator-gettingstarted
      pdf: https://docs.hibernate.org/validator/{series.version}/reference/en-US/pdf/hibernate_validator_reference.pdf#validator-gettingstarted
  api:
    - name: Javadoc
      description: API documentation
      html: https://docs.hibernate.org/validator/{series.version}/api/
  migration:
    - name: Migration Guide
      description: Guide for migrating from the previous version
      html: /validator/documentation/migration-guide/#{series.version.dashes}-x
maven:
  artifacts:
    - artifact_id: hibernate-validator
      summary: Core implementation
    - artifact_id: hibernate-validator-cdi
      summary: CDI integration
    - artifact_id: hibernate-validator-annotation-processor
      summary: Annotation processor
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '21'
      - '22'
      - '23'
      - '25'
  jakarta_ee_bv:
    version: '3.0'
  jakarta_ee:
    version: '10'
  quarkus:
    version:
      from: '3.0'
      to: '3.23'
  spring_boot:
    version:
      from: '3.0'
      to: '3.5'
  wildfly:
    version:
      - from: '27'
        to: '39'
      - from: '40'
        to: '41'
        comment: "link:http://docs.wildfly.org/40/Different_Flavors_of_WildFly.html#wildfly-ee-10[EE 10 variant]"
  rheap:
    version:
      from: '8.0'
      to: '8.1'
