summary: "Jakarta Data, `@ConcreteProxy`, Extended Array Support, Embeddable Inheritance"
license:
  name: LGPL v2.1
  url: https://raw.githubusercontent.com/hibernate/hibernate-orm/6.6/lgpl.txt
links:
  whats_new:
    html: "/orm/releases/{series.version}/#whats-new"
  doc:
    html: /orm/documentation/{series.version}/
  reference_doc:
    html: https://docs.hibernate.org/orm/{series.version}/userguide/html_single/
    name: User Guide
  reference:
    - name: Integrations Guide
      html: https://docs.hibernate.org/orm/{series.version}/integrationguide/html_single/Hibernate_Integration_Guide.html
    - name: Query Language Guide
      html: https://docs.hibernate.org/orm/{series.version}/querylanguage/html_single/Hibernate_Query_Language.html
    - name: Data Repositories Guide
      html: https://docs.hibernate.org/orm/{series.version}/repositories/html_single/Hibernate_Data_Repositories.html
  api:
    - name: Javadoc
      description: API documentation
      html: https://docs.hibernate.org/orm/{series.version}/javadocs/
    - name: "Jakarta Persistence 3.1 Javadoc"
      html: https://jakarta.ee/specifications/persistence/3.1/apidocs/
      description: "The Jakarta Persistence (3.1) Javadocs"
  reports:
    - name: "Incubating report"
      html: https://docs.hibernate.org/orm/{series.version}/incubating/incubating.txt
      description: "Report of code that is considered incubating, and therefore subject to change."
    - name: "Deprecation report"
      html: https://docs.hibernate.org/orm/{series.version}/deprecated/deprecated.txt
      description: "Report of code that is considered deprecated.  Defined as the union of `@Deprecated` and `@Remove`"
    - name: "Internals report"
      html: https://docs.hibernate.org/orm/{series.version}/internals/internal.txt
      description: "Report of code that is considered internal and not supported for use by code other than Hibernate itself."
    - name: "Dialect report"
      html: https://docs.hibernate.org/orm/{series.version}/dialect/dialect.html
      description: "Report of supported databases and versions"
  introduction:
    - name: Getting Started
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/orm/{series.version}/quickstart/html_single/
    - name: Short Guide
      description: A readable and opinionated introduction
      html: https://docs.hibernate.org/orm/{series.version}/introduction/html_single/
      pdf: https://docs.hibernate.org/orm/{series.version}/introduction/pdf/Hibernate_Introduction.pdf
  migration:
    - name: Migration Guide
      description: Guide for migrating from the previous version
      html: https://docs.hibernate.org/orm/{series.version}/migration-guide/
maven:
  artifacts:
    - artifact_id: hibernate-core
      summary: Core implementation
    - artifact_id: hibernate-spatial
      summary: Spatial support
    - artifact_id: hibernate-envers
      summary: Envers audit support
    - artifact_id: hibernate-hikaricp
      summary: HikariCP connection pooling
    - artifact_id: hibernate-c3p0
      summary: c3p0 connection pooling
    - artifact_id: hibernate-proxool
      summary: Proxool connection pooling
    - artifact_id: hibernate-jcache
      summary: JCache second-level caching
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '21'
      - value: 25
        comment: "6.6.40+"
      - value: 26
        comment: "6.6.49+"
  jakarta_ee_jpa:
    version: '3.1'
  jakarta_ee_data:
    version: '1.0'
  jakarta_ee:
    version: '10'
  dialect_mongodb:
    version: '1.0'
  quarkus:
    version:
      from: '3.14'
      to: '3.23'
  spring_boot:
    version:
      from: '3.4'
      to: '3.5'
  wildfly:
    version:
      - from: '34'
        to: '39'
      - from: '40'
        to: '41'
        comment: "link:http://docs.wildfly.org/40/Different_Flavors_of_WildFly.html#wildfly-ee-10[EE 10 variant]"
  rheap:
    version: '8.1'
subprojects:
  repositories:
    summary: Jakarta Data 1.0, compatibility with Hibernate ORM 6
    links:
      doc:
        html: /repositories/documentation/{series.version}/
      reference_doc:
        html: https://docs.hibernate.org/orm/{series.version}/repositories/html_single/
      introduction:
        - name: Getting Started
          description: A quickstart-style tutorial
          html: https://docs.hibernate.org/orm/{series.version}/repositories/html_single/#configuration-integration
      api:
        - name: Javadoc
          description: API documentation
          html: https://jakarta.ee/specifications/data/1.0/apidocs/
      reference:
        - name: "Jakarta Data"
          html: https://jakarta.ee/specifications/data/1.0/jakarta-data-1.0
          pdf: https://jakarta.ee/specifications/data/1.0/jakarta-data-1.0.pdf
          description: "The Jakarta Data Specification (version 1.0)"
    maven:
      artifacts:
        - artifact_id: hibernate-jpamodelgen
          summary: Annotation processor
        - artifact_id: hibernate-core
          summary: Runtime support
