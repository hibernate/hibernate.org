license:
  name: LGPL v2.1
  url: https://raw.githubusercontent.com/hibernate/hibernate-orm/5.1/lgpl.txt
links:
  dist:
    sourceforge:
      zip: https://sourceforge.net/projects/hibernate/files/hibernate-orm/{release.version}/hibernate-release-{release.version}.zip/download
  whats_new:
    html: "/orm/releases/{series.version}/#whats-new"
  doc:
    html: /orm/documentation/{series.version}/
  reference_doc:
    html: https://docs.hibernate.org/orm/{series.version}/userguide/html_single/
    name: User Guide
  reference:
    - name: "Integrations Guide"
      html: https://docs.hibernate.org/orm/{series.version}/integrationsGuide/html_single/
  api:
    - name: Javadoc
      description: API documentation
      html: https://docs.hibernate.org/orm/{series.version}/javadocs/
    - name: "JPA 2.1 Javadoc"
      html: https://docs.hibernate.org/jpa/2.1/api/
  introduction:
    - name: Getting Started
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/orm/{series.version}/quickstart/html_single/
    - name: Short Guide
      description: A readable and opinionated introduction
      html: https://docs.hibernate.org/orm/{series.version}/introduction/html_single/
      pdf: https://docs.hibernate.org/orm/{series.version}/introduction/pdf/Hibernate_Introduction.pdf
  migration:
    - name: Migration Guide
      description: Guide for migrating from the previous version
      html: https://github.com/hibernate/hibernate-orm/blob/5.1/migration-guide.adoc
maven:
  coord:
    group_id: org.hibernate
    main_artifact_id: hibernate-core
  repo:
    snapshots: jboss
  artifacts:
    - artifact_id: hibernate-core
      summary: Core implementation
    - artifact_id: hibernate-entitymanager
      summary: JPA support
    - artifact_id: hibernate-java8
      summary: Java 8 support
    - artifact_id: hibernate-osgi
      summary: OSGi integration
    - artifact_id: hibernate-spatial
      summary: Spatial support
    - artifact_id: hibernate-envers
      summary: Envers audit support
    - artifact_id: hibernate-hikaricp
      summary: HikariCP connection pooling
    - artifact_id: hibernate-c3p0
      summary: c3p0 connection pooling
    - artifact_id: hibernate-proxool
      summary: Proxool connection pooling
    - artifact_id: hibernate-infinispan
      summary: Infinispan second-level caching
    - artifact_id: hibernate-ehcache
      summary: Ehcache second-level caching
integration_constraints:
  java:
    version:
      - value: 6
        comment: "up to 5.1.15"
      - value: 7
        comment: "up to 5.1.16"
      - value: 8
  java_ee_jpa:
    version: '2.1'
  java_ee:
    version: '7'  # Derived from JPA 2.1 → Java EE 7
  wildfly:
    version:
      - '12'
      - '13'
