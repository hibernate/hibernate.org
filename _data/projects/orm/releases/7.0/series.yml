summary: Jakarta Persistence 3.2, Java 17, Hibernate Models, mapping.xsd, hbm.xml transformation, Apache License
maven:
  artifacts:
    - artifact_id: hibernate-core
      summary: Core implementation
    - artifact_id: hibernate-spatial
      summary: Spatial support
    - artifact_id: hibernate-vector
      summary: Vector support
    - artifact_id: hibernate-envers
      summary: Envers audit support
    - artifact_id: hibernate-agroal
      summary: Agroal connection pooling
    - artifact_id: hibernate-hikaricp
      summary: HikariCP connection pooling
    - artifact_id: hibernate-c3p0
      summary: c3p0 connection pooling
    - artifact_id: hibernate-jcache
      summary: JCache second-level caching
    - artifact_id: hibernate-micrometer
      summary: Integration for Micrometer
    - artifact_id: hibernate-jfr
      summary: Integration for Java Flight Recorder
    - artifact_id: hibernate-community-dialects
      summary: Community-maintained SQL dialects
    - artifact_id: hibernate-processor
      summary: Hibernate Processor compile-time tooling
integration_constraints:
  java:
    version: 17, 21 or 23
  jakarta_ee_jpa:
    version: 3.2
  jakarta_ee:
    version: 11
