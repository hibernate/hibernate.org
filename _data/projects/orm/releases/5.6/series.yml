summary: Dropped support for Javassist, Performance
license:
  name: LGPL v2.1
  url: https://raw.githubusercontent.com/hibernate/hibernate-orm/5.6/lgpl.txt
displayed: false
links:
  migration_guide:
    html: https://github.com/hibernate/hibernate-orm/blob/5.6/migration-guide.adoc
  whats_new:
    html: "/orm/releases/{series.version}/#whats-new"
  reference:
    - name: Integrations Guide
      html: https://docs.hibernate.org/orm/{series.version}/integrationguide/html_single/Hibernate_Integration_Guide.html
  api:
    - name: "JPA 2.2 Javadoc"
      html: https://jakarta.ee/specifications/persistence/2.2/apidocs/
    - name: "JPA 3.0 Javadoc"
      html: https://jakarta.ee/specifications/persistence/3.0/apidocs/
maven:
  coord:
    group_id: org.hibernate
    main_artifact_id: hibernate-core
  repo:
    snapshots: jboss
  artifacts:
    - artifact_id: hibernate-core
      summary: Core implementation
    - artifact_id: hibernate-osgi
      summary: OSGi integration
    - artifact_id: hibernate-spatial
      summary: Spatial support
    - artifact_id: hibernate-envers
      summary: Envers audit support
    - artifact_id: hibernate-hikaricp
      summary: HikariCP connection pooling
    - artifact_id: hibernate-c3p0
      summary: c3p0 connection pooling
    - artifact_id: hibernate-proxool
      summary: Proxool connection pooling
    - artifact_id: hibernate-jcache
      summary: JCache second-level caching
    - artifact_id: hibernate-infinispan
      summary: Infinispan second-level caching
    - artifact_id: hibernate-ehcache
      summary: Ehcache second-level caching
integration_constraints:
  java:
    version:
      - '8'
      - '11'
      - '17'
      - '18'
  java_ee_jpa:
    version:
      value: '2.2'
      comment: main artifacts
  jakarta_ee_jpa:
    version:
      value: '3.0'
      comment: >-
        https://in.relation.to/2021/06/02/hibernate-orm-550-final-release/[through `*-jakarta` artifacts]
  java_ee:
    version:
      value: '8'
      comment: main artifacts
  jakarta_ee:
    version:
      value: '9'
      comment: >-
        https://in.relation.to/2021/06/02/hibernate-orm-550-final-release/[through `*-jakarta` artifacts]
  quarkus:
    version:
      from: '2.3'
      to: '2.16'
      comment: 'excluding 2.3.0'
  spring_boot:
    version:
      from: '2.6'
      to: '2.7'
