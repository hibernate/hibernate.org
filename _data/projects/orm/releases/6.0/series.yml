summary: Performance, HQL, Criteria, Type System
license:
  name: LGPL v2.1
  url: https://raw.githubusercontent.com/hibernate/hibernate-orm/6.0/lgpl.txt
links:
  whats_new:
    html: "/orm/releases/{series.version}/#whats-new"
  doc:
    html: /orm/documentation/{series.version}/
  reference_doc:
    html: https://docs.hibernate.org/orm/{series.version}/userguide/html_single/
    name: User Guide
  reference:
    - name: Integrations Guide
      html: https://docs.hibernate.org/orm/{series.version}/integrationguide/html_single/Hibernate_Integration_Guide.html
  api:
    - name: Javadoc
      description: API documentation
      html: https://docs.hibernate.org/orm/{series.version}/javadocs/
    - name: "Jakarta Persistence 3.1 Javadoc"
      html: https://jakarta.ee/specifications/persistence/3.1/apidocs/
    - name: "Jakarta Persistence 3.0 Javadoc"
      html: https://jakarta.ee/specifications/persistence/3.0/apidocs/
  introduction:
    - name: Getting Started
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/orm/{series.version}/quickstart/html_single/
    - name: Short Guide
      description: A readable and opinionated introduction
      html: https://docs.hibernate.org/orm/{series.version}/introduction/html_single/
      pdf: https://docs.hibernate.org/orm/{series.version}/introduction/pdf/Hibernate_Introduction.pdf
  migration:
    - name: Migration Guide
      description: Guide for migrating from the previous version
      html: https://docs.hibernate.org/orm/{series.version}/migration-guide/
maven:
  repo:
    snapshots: jboss
  artifacts:
    - artifact_id: hibernate-core
      summary: Core implementation
    - artifact_id: hibernate-spatial
      summary: Spatial support
    - artifact_id: hibernate-envers
      summary: Envers audit support
    - artifact_id: hibernate-hikaricp
      summary: HikariCP connection pooling
    - artifact_id: hibernate-c3p0
      summary: c3p0 connection pooling
    - artifact_id: hibernate-proxool
      summary: Proxool connection pooling
    - artifact_id: hibernate-jcache
      summary: JCache second-level caching
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '18'
  jakarta_ee_jpa:
    version:
      - '3.1'
      - '3.0'
  jakarta_ee:
    version:
      - '10'
      - '9'
