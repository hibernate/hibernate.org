summary: Java Time Handling, Configurable Query Cache Layout, records as @IdClass, auto-enabled Filters, Key-based Pagination, Jakarta Data (tech preview)
license:
  name: LGPL v2.1
  url: https://raw.githubusercontent.com/hibernate/hibernate-orm/6.5/lgpl.txt
links:
  whats_new:
    html: "/orm/releases/{series.version}/#whats-new"
  reference:
    - name: Integrations Guide
      html: https://docs.hibernate.org/orm/{series.version}/integrationguide/html_single/Hibernate_Integration_Guide.html
    - name: Query Language Guide
      html: https://docs.hibernate.org/orm/{series.version}/querylanguage/html_single/Hibernate_Query_Language.html
  api:
    - name: "Jakarta Persistence 3.1 Javadoc"
      html: https://jakarta.ee/specifications/persistence/3.1/apidocs/
      description: "The Jakarta Persistence (3.1) Javadocs"
  reports:
    - name: "Incubating report"
      html: https://docs.hibernate.org/orm/{series.version}/incubating/incubating.txt
      description: "Report of code that is considered incubating, and therefore subject to change."
    - name: "Deprecation report"
      html: https://docs.hibernate.org/orm/{series.version}/deprecated/deprecated.txt
      description: "Report of code that is considered deprecated.  Defined as the union of `@Deprecated` and `@Remove`"
    - name: "Internals report"
      html: https://docs.hibernate.org/orm/{series.version}/internals/internal.txt
      description: "Report of code that is considered internal and not supported for use by code other than Hibernate itself."
    - name: "Dialect report"
      html: https://docs.hibernate.org/orm/{series.version}/dialect/dialect.html
      description: "Report of supported databases and versions"
maven:
  artifacts:
    - artifact_id: hibernate-core
      summary: Core implementation
    - artifact_id: hibernate-spatial
      summary: Spatial support
    - artifact_id: hibernate-envers
      summary: Envers audit support
    - artifact_id: hibernate-hikaricp
      summary: HikariCP connection pooling
    - artifact_id: hibernate-c3p0
      summary: c3p0 connection pooling
    - artifact_id: hibernate-proxool
      summary: Proxool connection pooling
    - artifact_id: hibernate-jcache
      summary: JCache second-level caching
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '21'
  jakarta_ee_jpa:
    version: '3.1'
  jakarta_ee:
    version: '10'
  quarkus:
    version:
      from: '3.11'
      to: '3.13'
  spring_boot:
    version: '3.3'
