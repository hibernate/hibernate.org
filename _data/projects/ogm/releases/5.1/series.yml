summary: Hibernate ORM 5.1, Neo4j and Infinispan remote, Aggregation in MongoDB native queries, Operations grouping
maven:
  artifacts:
    - artifact_id: hibernate-search-infinispan
      summary: Infinispan integration (embedded)
    - artifact_id: hibernate-ogm-infinispan-remote
      summary: Infinispan integration (remote)
    - artifact_id: hibernate-ogm-mongodb
      summary: MongoDB integration
    - artifact_id: hibernate-ogm-neo4j
      summary: Neo4j integration
    - artifact_id: hibernate-ogm-couchdb
      summary: CouchDB integration
    - artifact_id: hibernate-ogm-cassandra
      summary: Cassandra integration
    - artifact_id: hibernate-ogm-ehcache
      summary: Ehcache integration
    - artifact_id: hibernate-ogm-redis
      summary: Redis integration
links:
  reference_doc:
    html: https://docs.hibernate.org/ogm/{series.version}/reference/en-US/html_single/
    pdf: https://docs.hibernate.org/ogm/{series.version}/reference/en-US/pdf/hibernate_ogm_reference.pdf
  javadoc:
    html: https://docs.hibernate.org/ogm/{series.version}/api/
  getting_started_guide:
    html: https://docs.hibernate.org/ogm/{series.version}/reference/en-US/html_single/#ogm-gettingstarted
    pdf: https://docs.hibernate.org/ogm/{series.version}/reference/en-US/pdf/hibernate_ogm_reference.pdf#ogm-gettingstarted
  migration_guide:
    html: https://developer.jboss.org/docs/DOC-52281
  whats_new:
    html: /ogm/releases/{series.version}/#whats-new
  dist:
    sourceforge:
      zip: https://sourceforge.net/projects/hibernate/files/hibernate-ogm/{release.version}/hibernate-ogm-{release.version}-dist.zip/download
integration_constraints:
  java:
    version:
      - '7'
      - '8'
  java_ee_jpa:
    version: '2.1'
  orm:
    version: '5.1'
  search:
    version: '5.6'
