date: 2026-10-29
announcement_url: https://in.relation.to/2026/10/30/hibernate-reactive-5_1_0_Beta1/
summary: >-
  Publishes a platform (BOM) (https://github.com/hibernate/hibernate-reactive/issues/2475[#2475]), checks the versions of Hibernate ORM and Vert.x at startup (https://github.com/hibernate/hibernate-reactive/issues/1796[#1796]), and supports the query cache with the reactive select executor (https://github.com/hibernate/hibernate-reactive/issues/3520[#3520]).
