summary: Release compatible with Hibernate ORM 6.5
maven:
  artifacts:
    - artifact_id: hibernate-reactive-core
      summary: Core implementation
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '20'
      - '21'
  orm:
    version: '6.5'
  vertx:
    version: '4.5'
  quarkus:
    version:
      from: '3.11'
      to: '3.13'
