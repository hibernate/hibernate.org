summary: Release with Hibernate ORM 6.2 and Vert.x 4.4
links:
  reference_doc:
    html: https://docs.hibernate.org/reactive/{series.version}/reference/html_single/
  whats_new:
    html: /reactive/releases/{series.version}/#whats-new
  introduction:
    - name: Getting Started
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/reactive/{series.version}/reference/html_single/#getting-started
  api:
    - name: Javadoc
      description: API documentation
      html: https://docs.hibernate.org/reactive/{series.version}/javadocs/
maven:
  artifacts:
    - artifact_id: hibernate-reactive-core
      summary: Core implementation
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '20'
      - '21'
  orm:
    version: '6.2'
  vertx:
    version: '4.4'
  quarkus:
    version:
      from: '3.0'
      to: '3.6'
