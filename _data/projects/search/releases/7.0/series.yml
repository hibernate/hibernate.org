summary: >-
  Switch to Jakarta EE / ORM 6.4 without `-orm6` artifacts, 
  Hibernate Search BOM
license:
  name: LGPL v2.1
  url: https://raw.githubusercontent.com/hibernate/hibernate-search/7.0/lgpl.txt
links:
  reference_doc:
    html: https://docs.hibernate.org/search/{series.version}/reference/en-US/html_single/
    pdf: https://docs.hibernate.org/search/{series.version}/reference/en-US/pdf/hibernate_search_reference.pdf
  whats_new:
    html: "/search/releases/{series.version}/#whats-new"
  dist:
    sourceforge:
      zip: https://sourceforge.net/projects/hibernate/files/hibernate-search/{release.version}/hibernate-search-{release.version}-dist.zip/download
  introduction:
    - name: Getting Started (ORM)
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/search/{series.version}/getting-started/orm/en-US/html_single/
      pdf: https://docs.hibernate.org/search/{series.version}/getting-started/orm/en-US/pdf/hibernate_search_getting_started_orm.pdf
    - name: Getting Started (Standalone)
      description: A quickstart-style tutorial
      html: https://docs.hibernate.org/search/{series.version}/getting-started/standalone/en-US/html_single/
      pdf: https://docs.hibernate.org/search/{series.version}/getting-started/standalone/en-US/pdf/hibernate_search_getting_started_standalone.pdf
  api:
    - name: Javadoc
      description: API documentation
      html: https://docs.hibernate.org/search/{series.version}/api/
  migration:
    - name: Migration Guide
      description: Guide for migrating from the previous version
      html: https://docs.hibernate.org/search/{series.version}/migration/html_single/
      pdf: https://docs.hibernate.org/search/{series.version}/migration/pdf/hibernate_search_migration.pdf
maven:
  artifacts:
    - artifact_id: hibernate-search-bom
      summary: Hibernate Search BOM
    - artifact_id: hibernate-search-mapper-orm
      summary: Hibernate ORM mapper
    - artifact_id: hibernate-search-mapper-orm-outbox-polling
      summary: "\"outbox-polling\" coordination strategy for the Hibernate ORM mapper"
    - artifact_id: hibernate-search-mapper-pojo-standalone
      summary: Standalone POJO mapper
    - artifact_id: hibernate-search-backend-lucene
      summary: Lucene backend
    - artifact_id: hibernate-search-backend-elasticsearch
      summary: Elasticsearch/OpenSearch backend
    - artifact_id: hibernate-search-backend-elasticsearch-aws
      summary: Amazon IAM authentication for Elasticsearch/OpenSearch
    - artifact_id: hibernate-search-mapper-orm-jakarta-batch-core
      summary: Jakarta Batch mass indexing job for the Hibernate ORM mapper - Core
    - artifact_id: hibernate-search-mapper-orm-jakarta-batch-jberet
      summary: Jakarta Batch mass indexing job for the Hibernate ORM mapper - JBeret specifics
    - artifact_id: hibernate-search-v5migrationhelper-orm
      summary: Helper for migrating from Hibernate Search 5 to Hibernate Search 6/7 (Hibernate ORM mapper + Lucene backend)
integration_constraints:
  java:
    version:
      - '11'
      - '17'
      - '21'
  orm:
    version: '6.4'
  elasticsearch:
    version:
      from: '7.10'
      to: '8.12'
  opensearch:
    version:
      from: '1.3'
      to: '2.11'
  lucene:
    version: '9.8'
  quarkus:
    version:
      from: '3.7'
      to: '3.8'
  wildfly:
    version: '31'
