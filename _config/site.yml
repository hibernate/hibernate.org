# Default page title
title: Hibernate

# Project id name
project: hibernate

# Default minify settings
minify: true
js_minifier: disabled
css_minifier: enabled
html_minifier: disabled
minified: .min

# Maven
maven:
  repo:
    central:
      name: Maven Central
      repo_url: 'https://repo.maven.apache.org/maven2'
      web_ui_url: 'https://central.sonatype.com'
      old_web_ui_url: 'https://search.maven.org'
      help_setup_url: 'https://central.sonatype.org/consume/'
    central_snapshots:
      name: Sonatype Maven Central snapshots
      repo_url: 'https://central.sonatype.com/repository/maven-snapshots'
      web_ui_url: 'https://central.sonatype.com/service/rest/repository/browse/maven-snapshots'
    ossrh_snapshots:
      name: Sonatype OSS snapshots
      repo_url: 'https://oss.sonatype.org/content/repositories/snapshots'
      web_ui_url: 'https://oss.sonatype.org/'
    jboss:
      name: JBoss Nexus
      repo_url: 'https://repository.jboss.org/nexus/content/repositories/public'
      web_ui_url: 'https://oss.sonatype.org/#view-repositories;snapshots~browsestorage'

