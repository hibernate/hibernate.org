# project specific information
projects:
  ##################################################################################################
  # ORM
  ##################################################################################################
  orm:
    name: Hibernate ORM
    icon: 'icon-database'
    description: |
      Idiomatic persistence for Java and relational databases.
    more_resources_url: '/orm/more-resources/'
    links:
      doc:
        html: /orm/documentation/{series.version}/
      reference_doc:
        name: User Guide
        html: https://docs.hibernate.org/orm/{series.version}/userguide/html_single/
        latest_stable:
          html: https://docs.hibernate.org/stable/orm/userguide/html_single/
      javadoc:
        html: https://docs.hibernate.org/orm/{series.version}/javadocs/
        latest_stable:
          html: https://docs.hibernate.org/stable/orm/javadocs/
      getting_started_guide:
        html: https://docs.hibernate.org/orm/{series.version}/quickstart/html_single/
      migration_guide:
        html: https://docs.hibernate.org/orm/{series.version}/migration-guide/
      short_guide:
        html: https://docs.hibernate.org/orm/{series.version}/introduction/html_single/
        pdf: https://docs.hibernate.org/orm/{series.version}/introduction/pdf/Hibernate_Introduction.pdf
      whats_new:
        html: https://docs.hibernate.org/orm/{series.version}/whats-new/
      dist:
        # No longer distributing dists on sourceforge, starting with ORM 6.0.
    maven:
      coord:
        group_id: org.hibernate.orm
        main_artifact_id: hibernate-core
      repo:
        releases: central
        snapshots: central_snapshots
    blog_tag: Hibernate ORM
    blog_tag_url: hibernate-orm
    license:
      name: ASL v2
      url: https://raw.githubusercontent.com/hibernate/hibernate-orm/main/LICENSE.txt
      # This data is also overridden in relevant series.yml and earlier 7.0.0.{Alpha,Beta}*.yml to display correctly on releases pages
      since: "7.0.0.Beta5"
    copyright:
      url: https://raw.githubusercontent.com/hibernate/hibernate-orm/main/AUTHORS.txt
    jira:
      key: HHH
    github:
      project: hibernate-orm
    menu:
      intern:
        - name: About
          href: '/orm/'
          css_class: 'home'
        - name: Releases
          href: '/orm/releases/'
          css_class: 'tags'
          releases_submenu: true
        - name: Documentation
          href: '/orm/documentation/'
          css_class: 'book'
        - name: Quickly
          href: '/orm/quickly/'
          css_class: 'rocket'
        - name: Migration guides
          href: '/orm/documentation/migrate/'
          css_class: 'share'
        - name: More resources
          href: '/orm/more-resources/'
          css_class: 'bookmark'
        - name: Processor
          href: '/orm/processor/'
          css_class: 'cogs'
        - name: Tooling
          href: '/orm/tooling/'
          css_class: 'wrench'
        - name: Contribute
          href: '/community/contribute/'
          css_class: 'users'
        - name: Paid support
          href: '/support/long-term/'
          css_class: 'doctor'
      extern:
        - name: Source code
          href: 'https://github.com/hibernate/hibernate-orm'
          css_class: 'code'
        - name: Issue tracker
          href: 'https://hibernate.atlassian.net/browse/HHH'
          css_class: 'bug'
        - name: Security issue
          href: 'https://github.com/hibernate/.github/security/policy'
          css_class: 'lock'
        - name: Forum
          href: 'https://discourse.hibernate.org/c/hibernate-orm'
          css_class: 'comments'
        - name: CI
          href: 'https://ci.hibernate.org/'
          css_class: 'treatment'
        - name: Roadmap
          href: 'https://github.com/hibernate/hibernate-orm/wiki/Roadmap'
          css_class: 'road'

