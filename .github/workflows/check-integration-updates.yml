name: Check Integration Updates

on:
  schedule:
    - cron: '0 7 * * 0' # Sunday 7:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Check integration updates
        run: bash .github/integration-tracking/check-updates.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set the issue number to update with results.
          # Leave empty to just log the results without updating any issue.
          TRACKING_ISSUE_NUMBER: ""
