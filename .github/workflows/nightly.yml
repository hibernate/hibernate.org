name: Nightly Checks

on:
  schedule:
    - cron: '0 7 * * *' # Daily 7:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-announcements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check announcement links
        run: bash .github/announcement-tracking/check-announcement-links.sh
