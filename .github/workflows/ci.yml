name: GH Actions CI

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Build site
        run: |
          docker run --pull always --rm -t -u "$(id -u):$(id -g)" -v "$WORKSPACE_DIR":/home/dev/website:rw quay.io/hibernate/awestruct-build-env:latest "rake setup && rake clean[all] gen[production]"
        env:
          WORKSPACE_DIR: ${{ github.workspace }}

      - name: Upload site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: docs-preview
          path: _site/
          retention-days: 1
